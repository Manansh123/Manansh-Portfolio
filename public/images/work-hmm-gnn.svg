<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" width="1400" height="875">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f14"/>
      <stop offset="100%" stop-color="#17171d"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9515A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7B353C" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="hmmLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B353C" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#A9515A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B353C" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="875" fill="url(#bg)"/>

  <!-- Ambient glow: center -->
  <ellipse cx="700" cy="437" rx="500" ry="300" fill="#7B353C" fill-opacity="0.04"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="125" x2="1400" y2="125"/>
    <line x1="0" y1="250" x2="1400" y2="250"/>
    <line x1="0" y1="375" x2="1400" y2="375"/>
    <line x1="0" y1="500" x2="1400" y2="500"/>
    <line x1="0" y1="625" x2="1400" y2="625"/>
    <line x1="0" y1="750" x2="1400" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="875"/>
    <line x1="400" y1="0" x2="400" y2="875"/>
    <line x1="600" y1="0" x2="600" y2="875"/>
    <line x1="800" y1="0" x2="800" y2="875"/>
    <line x1="1000" y1="0" x2="1000" y2="875"/>
    <line x1="1200" y1="0" x2="1200" y2="875"/>
  </g>

  <!-- ============ HMM STATE CHAIN (top half) ============ -->
  <!-- Title label -->
  <text x="700" y="90" font-family="monospace" font-size="11" fill="#A9515A" fill-opacity="0.6" text-anchor="middle" letter-spacing="3">CONTINUOUS HIDDEN MARKOV MODELS</text>

  <!-- HMM states: S1..S5 -->
  <!-- Transition arrows -->
  <line x1="205" y1="220" x2="345" y2="220" stroke="#A9515A" stroke-opacity="0.35" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="220" x2="545" y2="220" stroke="#A9515A" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="655" y1="220" x2="745" y2="220" stroke="#A9515A" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="855" y1="220" x2="945" y2="220" stroke="#A9515A" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1055" y1="220" x2="1145" y2="220" stroke="#A9515A" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Self-loops (arcs) -->
  <path d="M175,200 Q175,155 205,155 Q235,155 235,200" fill="none" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1.2"/>
  <path d="M375,200 Q375,155 405,155 Q435,155 435,200" fill="none" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1.2"/>
  <path d="M575,200 Q575,155 605,155 Q635,155 635,200" fill="none" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1.2"/>
  <path d="M775,200 Q775,155 805,155 Q835,155 835,200" fill="none" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1.2"/>
  <path d="M975,200 Q975,155 1005,155 Q1035,155 1005,200" fill="none" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1.2"/>

  <!-- HMM state circles -->
  <circle cx="190" cy="220" r="38" fill="#1e1e2e" stroke="#A9515A" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="400" cy="220" r="38" fill="#1e1e2e" stroke="#A9515A" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="600" cy="220" r="38" fill="#1e1e2e" stroke="#A9515A" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="800" cy="220" r="38" fill="#1e1e2e" stroke="#A9515A" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1000" cy="220" r="38" fill="#1e1e2e" stroke="#A9515A" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="1190" cy="220" r="28" fill="#7B353C" fill-opacity="0.3" stroke="#A9515A" stroke-opacity="0.7" stroke-width="2"/>

  <!-- State labels -->
  <text x="190" y="225" font-family="monospace" font-size="13" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">S₁</text>
  <text x="400" y="225" font-family="monospace" font-size="13" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">S₂</text>
  <text x="600" y="225" font-family="monospace" font-size="13" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">S₃</text>
  <text x="800" y="225" font-family="monospace" font-size="13" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">S₄</text>
  <text x="1000" y="225" font-family="monospace" font-size="13" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">S₅</text>
  <text x="1190" y="225" font-family="monospace" font-size="11" fill="#A9515A" fill-opacity="0.9" text-anchor="middle">END</text>

  <!-- Observation emission lines -->
  <g stroke="#7B353C" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,4">
    <line x1="190" y1="258" x2="190" y2="308"/>
    <line x1="400" y1="258" x2="400" y2="308"/>
    <line x1="600" y1="258" x2="600" y2="308"/>
    <line x1="800" y1="258" x2="800" y2="308"/>
    <line x1="1000" y1="258" x2="1000" y2="308"/>
  </g>
  <!-- Observation nodes -->
  <rect x="158" y="308" width="64" height="28" rx="5" fill="#1a1a24" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="368" y="308" width="64" height="28" rx="5" fill="#1a1a24" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="568" y="308" width="64" height="28" rx="5" fill="#1a1a24" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="768" y="308" width="64" height="28" rx="5" fill="#1a1a24" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="968" y="308" width="64" height="28" rx="5" fill="#1a1a24" stroke="#7B353C" stroke-opacity="0.4" stroke-width="1"/>
  <text x="190" y="326" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">COP_x</text>
  <text x="400" y="326" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">COP_y</text>
  <text x="600" y="326" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">vel_x</text>
  <text x="800" y="326" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">vel_y</text>
  <text x="1000" y="326" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4" text-anchor="middle">RMS</text>

  <!-- ============ FUSION LAYER (middle) ============ -->
  <text x="700" y="415" font-family="monospace" font-size="10" fill="#ffffff" fill-opacity="0.2" text-anchor="middle" letter-spacing="4">HMM – GNN FEATURE FUSION</text>
  <rect x="100" y="428" width="1200" height="2" rx="1" fill="url(#hmmLine)"/>

  <!-- ============ GNN GRAPH (lower half) ============ -->
  <text x="700" y="490" font-family="monospace" font-size="11" fill="#A9515A" fill-opacity="0.6" text-anchor="middle" letter-spacing="3">GRAPH NEURAL NETWORK</text>

  <!-- GNN edges -->
  <g stroke="#A9515A" stroke-opacity="0.18" stroke-width="1.2">
    <!-- center to surrounding -->
    <line x1="700" y1="620" x2="490" y2="565"/>
    <line x1="700" y1="620" x2="540" y2="700"/>
    <line x1="700" y1="620" x2="640" y2="760"/>
    <line x1="700" y1="620" x2="760" y2="760"/>
    <line x1="700" y1="620" x2="860" y2="700"/>
    <line x1="700" y1="620" x2="910" y2="565"/>
    <line x1="700" y1="620" x2="700" y2="528"/>
    <!-- peripheral connections -->
    <line x1="490" y1="565" x2="540" y2="700"/>
    <line x1="540" y1="700" x2="640" y2="760"/>
    <line x1="640" y1="760" x2="760" y2="760"/>
    <line x1="760" y1="760" x2="860" y2="700"/>
    <line x1="860" y1="700" x2="910" y2="565"/>
    <line x1="910" y1="565" x2="700" y2="528"/>
    <line x1="700" y1="528" x2="490" y2="565"/>
    <!-- cross edges -->
    <line x1="490" y1="565" x2="760" y2="760"/>
    <line x1="910" y1="565" x2="640" y2="760"/>
    <line x1="540" y1="700" x2="860" y2="700"/>
  </g>

  <!-- GNN nodes -->
  <!-- center node (classification output) -->
  <circle cx="700" cy="620" r="36" fill="url(#nodeGrad)" filter="url(#softglow)"/>
  <text x="700" y="616" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.95" text-anchor="middle">CLASS</text>
  <text x="700" y="630" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">OUTPUT</text>

  <!-- surrounding nodes -->
  <circle cx="700" cy="528" r="22" fill="#1e1e2e" stroke="#A9515A" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="700" y="533" font-family="monospace" font-size="8" fill="#A9515A" fill-opacity="0.9" text-anchor="middle">HMM</text>

  <circle cx="490" cy="565" r="22" fill="#1e1e2e" stroke="#7B353C" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="490" y="570" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">COP</text>

  <circle cx="540" cy="700" r="22" fill="#1e1e2e" stroke="#7B353C" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="540" y="705" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">VEL</text>

  <circle cx="640" cy="760" r="22" fill="#1e1e2e" stroke="#7B353C" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="640" y="765" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">GNN₁</text>

  <circle cx="760" cy="760" r="22" fill="#1e1e2e" stroke="#7B353C" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="760" y="765" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">GNN₂</text>

  <circle cx="860" cy="700" r="22" fill="#1e1e2e" stroke="#7B353C" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="860" y="705" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">SHAP</text>

  <circle cx="910" cy="565" r="22" fill="#1e1e2e" stroke="#7B353C" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="910" y="570" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">XAI</text>

  <!-- Side panels: COP signal waveform (left) -->
  <rect x="60" y="510" width="360" height="180" rx="8" fill="#1a1a24" fill-opacity="0.7"/>
  <text x="80" y="535" font-family="monospace" font-size="9" fill="#A9515A" fill-opacity="0.7" letter-spacing="2">COP SIGNAL · BALANCE TRACE</text>
  <!-- Waveform path approximating COP oscillation -->
  <polyline
    points="75,640 100,620 120,650 145,610 165,645 185,618 205,655 225,608 250,648 270,622 295,652 315,615 340,645 365,618 385,660 400,625"
    fill="none" stroke="#A9515A" stroke-opacity="0.6" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Zero line -->
  <line x1="70" y1="638" x2="410" y2="638" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <text x="80" y="680" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.2">mediolateral  ·  anteroposterior</text>

  <!-- Side panel: SHAP / XAI bar plot (right) -->
  <rect x="980" y="510" width="360" height="180" rx="8" fill="#1a1a24" fill-opacity="0.7"/>
  <text x="1000" y="535" font-family="monospace" font-size="9" fill="#A9515A" fill-opacity="0.7" letter-spacing="2">SHAP FEATURE IMPORTANCE</text>
  <!-- Feature bars -->
  <rect x="1000" y="550" width="190" height="12" rx="3" fill="#7B353C" fill-opacity="0.8"/>
  <text x="1198" y="561" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4">HMM-repr</text>
  <rect x="1000" y="572" width="155" height="12" rx="3" fill="#7B353C" fill-opacity="0.6"/>
  <text x="1163" y="583" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4">COP_vel</text>
  <rect x="1000" y="594" width="130" height="12" rx="3" fill="#3a3a5a" fill-opacity="0.8"/>
  <text x="1138" y="605" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4">RMS_AP</text>
  <rect x="1000" y="616" width="100" height="12" rx="3" fill="#3a3a5a" fill-opacity="0.6"/>
  <text x="1108" y="627" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4">freq_pk</text>
  <rect x="1000" y="638" width="75" height="12" rx="3" fill="#2a2a3a" fill-opacity="0.8"/>
  <text x="1083" y="649" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4">range_ML</text>
  <rect x="1000" y="660" width="50" height="12" rx="3" fill="#2a2a3a" fill-opacity="0.6"/>
  <text x="1058" y="671" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.4">sway_path</text>

  <!-- Bottom label -->
  <text x="700" y="848" font-family="monospace" font-size="12" fill="#ffffff" fill-opacity="0.15" text-anchor="middle" letter-spacing="2">HMM + GNN · PARKINSON'S BALANCE ANALYSIS · RESEARCH SCHEMATIC</text>
</svg>

